<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
      integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="main-cont">
      <h1 style="letter-spacing: 15px" class="text-primary">PERSONAL INFO</h1>
      <br />
      
      <div class="d-flex align-items-center justify-content-center mb-3 w-100">
        <strong class="mr-2">Name : </strong>
      <input
        id="name"
        type="text"
        placeholder="Enter your Name"
        class="form-control w-25"
      />
      </div>
      
      <br />
      <div class="d-flex align-items-center justify-content-center mb-3 w-100">
        <strong class="mr-2">City : </strong>
        <input
          id="city"
          type="text"
          placeholder="Enter your City"
          class="form-control w-25"
        />
      </div>
      
      <br />
      <div class="d-flex align-items-center justify-content-center mb-3 w-100">
        <strong class="mr-2">Status : </strong>
      <input
        id="status"
        type="text"
        placeholder="Enter your Status"
        class="form-control w-25"
      />
      </div>

      <br />
      <div id="displayMsg"></div>
      <br /><br />
      <button
        class="btn btn-primary border border-primary rounded"
        id="addBtn"
        onclick="addInfo()"
      >
        Add
      </button>

      <br /><br />

      <div class="card w-75 border-primary">
        <div class="card-body">
          <h3 class="card-title mb-3">User Information</h3>
          <div id="cardData" class="d-flex flex-wrap"></div>
          <div id="updateCard" class="d-none"></div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
